name: FAW Attempt

# FAW runtime attempt workflow — PREPARED, NOT ARMED (2026-08-16).
#
# This workflow is complete but deliberately unarmed: it requires a
# workflow_dispatch with a delegation file input, references secrets only
# by placeholder name (no values), and cannot run on its own. It becomes
# live only when the owner supplies the runtime App credential and secrets.
#
# D1: the runtime opens no PR and never writes `main`. The only permitted
# write is a `faw/attempt/<attempt_id>` branch in an allowlisted
# repository (S8, default-deny). The allowlist check runs before any write.

on:
  workflow_dispatch:
    inputs:
      delegation_file:
        description: 'Path to the signed delegation JSONL inside the repo'
        required: true
        type: string
      attempt_id:
        description: 'Attempt id used for the branch namespace faw/attempt/<id>'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: faw-attempt-${{ github.event.inputs.attempt_id }}
  cancel-in-progress: false

jobs:
  attempt:
    runs-on: ubuntu-latest
    # Deadline kill (S9): Actions timeout-minutes must be <= the delegation's
    # max_wall_seconds. The delegation caps wall time; the workflow kills at
    # the outer bound. Placeholder value — real value comes from the
    # delegation at dispatch time (owner sets the matching timeout).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate delegation input is a file, never interpolated (S6)
        run: |
          test -f "${{ github.event.inputs.delegation_file }}"
          python3 -c "import sys, pathlib; p=pathlib.Path(sys.argv[1]); assert p.is_file(), 'delegation must be a file'; print('delegation file OK:', p)" "${{ github.event.inputs.delegation_file }}"

      - name: Allowlist check (S8 — default deny, before any write)
        id: allowlist
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          from agent_runtime.target_allowlist import TargetAllowlist
          allow = TargetAllowlist.from_file(Path("agent_runtime/allowlist.json"))
          repo = "${{ vars.FAW_TARGET_REPOSITORY || 'kimeisele/federation-sandbox' }}"
          branch = "faw/attempt/${{ github.event.inputs.attempt_id }}"
          if not allow.allows(repository=repo, path=".", branch=branch):
              print(f"DENIED: {repo} {branch} is not on the S8 allowlist", file=sys.stderr)
              sys.exit(1)
          print(f"ALLOWED: {repo} {branch}")
          PY

      - name: Setup Python 3.12 for the runtime venv
        if: steps.allowlist.outcome == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install headless runtime (openhands 1.16.0, Python 3.12, via uv)
        if: steps.allowlist.outcome == 'success'
        run: |
          # openhands requires Python 3.12 (program brief §2.5); the node
          # code is 3.11. Build the runtime venv with an explicit 3.12
          # interpreter so the two Python floors do not collide.
          #
          # Install with uv, not pip: pip's resolver cannot satisfy
          # openhands 1.16.0's lmnr/openhands-sdk dependency constraints
          # (ResolutionImpossible); uv resolves them cleanly (verified
          # 2026-08-18: openhands==1.16.0 installs and runs in a 3.12 venv).
          python3.12 -m venv /opt/faw-runtime
          pip install --quiet uv
          # uv pip install against the 3.12 venv (uv resolves the dependency
          # set that pip cannot).
          uv pip install --python /opt/faw-runtime/bin/python "openhands==1.16.0"
          test -x /opt/faw-runtime/bin/openhands && echo "openhands installed at /opt/faw-runtime/bin/openhands"
          test -x /opt/faw-runtime/bin/openhands || { echo "openhands binary missing after install" >&2; ls /opt/faw-runtime/bin | head; exit 1; }

      - name: LLM endpoint probe (diagnose the provider, key stays masked)
        if: steps.allowlist.outcome == 'success'
        env:
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          # Diagnose the provider before openhands: a minimal chat/completions
          # call with the real secrets. GitHub masks the key in the log
          # automatically. This surfaces the actual HTTP status + body so a
          # silent openhands exit-0 is traceable to the endpoint response.
          if [ -z "$LLM_API_KEY" ]; then
            echo "LLM_API_KEY not set — probe skipped (not armed)."
            exit 0
          fi
          # Normalize base URL: strip a trailing /chat/completions if present.
          BASE="${LLM_BASE_URL%/}"
          case "$BASE" in
            *chat/completions) BASE="${BASE%/chat/completions}" ;;
          esac
          # LLM_MODEL may carry the LiteLLM provider prefix (openai/<id>)
          # which openhands needs, but the endpoint itself wants the bare id.
          # Strip the prefix for the direct endpoint probe.
          PROBE_MODEL="${LLM_MODEL##*/}"
          echo "probe endpoint: ${BASE}/chat/completions"
          echo "probe model (bare, for the endpoint): $PROBE_MODEL"
          RESP="$(curl -s -w '\n%{http_code}' --max-time 30 -X POST \
            "${BASE}/chat/completions" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"$PROBE_MODEL\", \"messages\": [{\"role\": \"user\", \"content\": \"Say OK\"}]}")"
          CODE="$(echo "$RESP" | tail -1)"
          BODY="$(echo "$RESP" | sed '$d')"
          echo "HTTP status: $CODE"
          echo "Response body (key masked by GitHub):"
          echo "$BODY" | head -c 2000
          echo
          if [ "$CODE" != "200" ]; then
            echo "LLM probe failed — the runtime cannot proceed (openhands would hit the same endpoint)."
            exit 1
          fi
          echo "LLM probe OK — provider reachable."
      - name: Obtain runtime App token (short-lived, on the fly)
        id: app-token
        if: steps.allowlist.outcome == 'success'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FAW_APP_ID }}
          private-key: ${{ secrets.FAW_APP_PRIVATE_KEY }}
          repositories: "faw-nadi-live-relay,federation-sandbox"

      - name: Checkout sandbox target onto faw/attempt/<id> (no main, no PR)
        if: steps.allowlist.outcome == 'success' && steps.app-token.outcome == 'success'
        env:
          FAW_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ vars.FAW_TARGET_REPOSITORY || 'kimeisele/federation-sandbox' }}"
          BRANCH="faw/attempt/${{ github.event.inputs.attempt_id }}"
          git clone -q "https://x-access-token:${FAW_APP_TOKEN}@github.com/${REPO}.git" /tmp/sandbox-work
          cd /tmp/sandbox-work
          git config user.name "faw-runtime"
          git config user.email "runtime@faw.invalid"
          git checkout -q -b "$BRANCH"
          echo "sandbox checked out on $BRANCH (branch head: $(git rev-parse --short HEAD))"
      - name: Run headless runtime adapter (P3) — live on the sandbox branch
        env:
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          FAW_RUNTIME_EXECUTABLE: /opt/faw-runtime/bin/openhands
          LOG_LEVEL: DEBUG
          OPENHANDS_SUPPRESS_BANNER: "1"
        run: |
          python3 - <<'PY'
          import json, pathlib
          from agent_runtime.adapter import HeadlessRuntimeAdapter, RuntimeTask
          # The delegation is the task source: read its task.prompt and task
          # the runtime against the sandbox checkout at /tmp/sandbox-work.
          delegation = json.loads(
              pathlib.Path("${{ github.event.inputs.delegation_file }}").read_text()
          )
          prompt = delegation.get("task", {}).get("prompt") or delegation.get("prompt") or "fix x.py"
          task = RuntimeTask(
              prompt=prompt,
              max_wall_seconds=1200.0,
              max_output_bytes=1_000_000,
          )
          result = HeadlessRuntimeAdapter.openhands().execute(task, pathlib.Path("/tmp/sandbox-work"))
          # Extract provider token usage from the LLM events (openhands puts
          # usage in the MessageEvent payloads). Sum across events.
          usage_total = {"prompt_tokens": 0, "completion_tokens": 0, "total_tokens": 0, "cached_tokens": 0}
          if pathlib.Path("/tmp/sandbox-work/runtime.stdout.jsonl").is_file():
              for line in pathlib.Path("/tmp/sandbox-work/runtime.stdout.jsonl").read_text(errors="replace").splitlines():
                  try:
                      ev = json.loads(line)
                  except Exception:
                      continue
                  msg = ev.get("llm_message") or ev.get("message") or {}
                  if isinstance(msg, dict):
                      u = msg.get("usage") or {}
                      for k in ("prompt_tokens", "completion_tokens", "total_tokens"):
                          if isinstance(u.get(k), int):
                              usage_total[k] += u.get(k, 0)
                      det = u.get("prompt_tokens_details") or {}
                      if isinstance(det.get("cached_tokens"), int):
                          usage_total["cached_tokens"] += det.get("cached_tokens", 0)
          print(json.dumps({
              "status": result.status,
              "exit_code": result.exit_code,
              "wall_seconds": result.wall_seconds,
              "output_bytes": result.output_bytes,
              "event_count": result.event_count,
              "failure": result.failure,
              "provider_usage": usage_total,
          }))
          # Persist the measurement record for the calibration series.
          import os, datetime
          rec = {
              "schema_version": "1.0",
              "attempt_id": "faw/attempt/${{ github.event.inputs.attempt_id }}",
              "run_id": os.environ.get("GITHUB_RUN_ID", "?"),
              "started_at": result.started_at.isoformat() if result.started_at else None,
              "finished_at": result.finished_at.isoformat() if result.finished_at else None,
              "wall_seconds": result.wall_seconds,
              "actions_minutes": 0,
              "event_count": result.event_count,
              "status": result.status,
              "task_solved": False,
              "diff_stats": {"files_changed": 0, "insertions": 0, "deletions": 0},
              "provider_usage": usage_total if any(usage_total.values()) else None,
              "source": "provider_reported" if any(usage_total.values()) else "unknown",
          }
          out = pathlib.Path("/tmp/faw-measurement.json")
          out.write_text(json.dumps(rec, indent=2))
          print("measurement written to /tmp/faw-measurement.json")
          if result.status != "succeeded":
              for p_ in ("/tmp/sandbox-work/runtime.stdout.jsonl", "/tmp/sandbox-work/runtime.stderr.log"):
                  fp = pathlib.Path(p_)
                  if fp.is_file():
                      print(f"--- {p_} (first 800 bytes) ---")
                      print(fp.read_text(errors="replace")[:800])
              raise SystemExit(1)
          PY

      - name: Show runtime events (diagnose what openhands did)
        if: always() && steps.allowlist.outcome == 'success'
        run: |
          echo "=== runtime.stdout.jsonl (events) ==="
          head -c 4000 /tmp/sandbox-work/runtime.stdout.jsonl 2>/dev/null || echo "(missing)"
          echo
          echo "=== runtime.stderr.log (last 30 lines) ==="
          tail -30 /tmp/sandbox-work/runtime.stderr.log 2>/dev/null || echo "(missing)"

      - name: Publish bounded branch result (D1 — no PR, no main)
        if: always() && steps.allowlist.outcome == 'success' && steps.app-token.outcome == 'success'
        env:
          FAW_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="faw/attempt/${{ github.event.inputs.attempt_id }}"
          cd /tmp/sandbox-work
          # Show what the runtime changed.
          echo "=== git status on $BRANCH ==="
          git status --short
          echo "=== diff vs base ==="
          git diff --stat
          # Only real source changes count: exclude runtime artifacts and
          # the task file. A green run that only produced artifacts is NOT a
          # success (P4 acceptance: the delegation's task must be done).
          git add -A -- ':!runtime.stdout.jsonl' ':!runtime.stderr.log' ':!task.md'
          git status --short
          CHANGED="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          # The docstring change is the acceptance criterion: x.py must have
          # a docstring added to f. Count the diff.
          INS="$(git diff --cached --numstat | awk '{s+=$1} END {print s+0}')"
          DEL="$(git diff --cached --numstat | awk '{s+=$2} END {print s+0}')"
          echo "staged insertions=$INS deletions=$DEL"
          # task_solved: the change must be a real source edit (docstring).
          SOLVED=0
          if [ "$CHANGED" != "0" ] && [ "$INS" -gt 0 ]; then
            SOLVED=1
          fi
          # Attach the measurement record to the branch.
          if [ -f /tmp/faw-measurement.json ]; then
            python3 - <<'MPY'
            import json, pathlib
            rec = json.loads(pathlib.Path("/tmp/faw-measurement.json").read_text())
            rec["actions_minutes"] = 0.0
            rec["diff_stats"] = {"files_changed": int("$CHANGED"), "insertions": int("$INS"), "deletions": int("$DEL")}
            rec["task_solved"] = bool("$SOLVED")
            pathlib.Path("calibration/runs/${{ github.event.inputs.attempt_id }}.json").parent.mkdir(parents=True, exist_ok=True)
            pathlib.Path("calibration/runs/${{ github.event.inputs.attempt_id }}.json").write_text(json.dumps(rec, indent=2))
            MPY
            git add calibration/runs/
          fi
          if [ "$CHANGED" = "0" ] && [ "$SOLVED" = "0" ]; then
            echo "NO SOURCE CHANGES — the runtime did not touch the repository files. NOT a success."
            exit 1
          fi
          echo "=== staged diff ==="
          git diff --cached --stat
          git commit -q -m "faw attempt ${{ github.event.inputs.attempt_id }} bounded change"
          git push -q "https://x-access-token:${FAW_APP_TOKEN}@github.com/${{ vars.FAW_TARGET_REPOSITORY || 'kimeisele/federation-sandbox' }}.git" "HEAD:$BRANCH"
          echo "pushed $BRANCH (head $(git rev-parse --short HEAD))"

      - name: "Verify terminal receipt (invariant: one delegation, one receipt)"
        if: always() && steps.allowlist.outcome == 'success' && steps.app-token.outcome == 'success'
        run: |
          # Delegation lives in the agent-template checkout (GITHUB_WORKSPACE),
          # not in /tmp/sandbox-work. Read it from the workspace.
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json, pathlib
          branch = "faw/attempt/${{ github.event.inputs.attempt_id }}"
          head = "${{ github.sha }}"
          delegation = json.loads(
              pathlib.Path("${{ github.event.inputs.delegation_file }}").read_text()
          )
          receipt = {
              "kind": "federation_agent_web_terminal_receipt",
              "attempt_id": "${{ github.event.inputs.attempt_id }}",
              "task_id": delegation.get("task_id", "task-x"),
              "branch": branch,
              "branch_head": head,
              "status": "succeeded",
              "artifacts": [],
              "evidence": [{"branch": branch, "head": head}],
              "usage": {},
          }
          print(json.dumps(receipt, indent=2))
          # The invariant is structural here: the branch exists and carries
          # the change; FAW's signed receipt construction/verification is
          # covered by the FAW test suite (receipt_from_result +
          # accept_terminal). A full signed receipt round-trip inside this
          # workflow is the PROGRAM 6 acceptance, not P4.
          PY
