name: Node Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Core validation (no secrets required)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pytest tests/ -q --tb=short || echo "::warning ::Some tests did not pass"

      - name: Check federation secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.FEDERATION_PAT }}" ]; then
            echo "has-federation-pat=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::Remote federation relay skipped: FEDERATION_PAT is not configured. Core validation remains available."
          else
            echo "has-federation-pat=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install nadi-kit and cryptography
        if: steps.check-secrets.outputs.has-federation-pat == 'true'
        run: pip install "nadi-kit @ git+https://github.com/kimeisele/steward-federation.git@c613577b7353d3cb1fd31be542aed8766f195079"

      - name: Run NADI heartbeat cycle
        if: steps.check-secrets.outputs.has-federation-pat == 'true'
        env:
          NODE_PRIVATE_KEY: ${{ secrets.NODE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.FEDERATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.FEDERATION_PAT }}
        run: |
          python3 -m nadi_kit --peer-json data/federation/peer.json sync
          python3 -m nadi_kit --peer-json data/federation/peer.json heartbeat --health 1.0
          python3 -m nadi_kit --peer-json data/federation/peer.json sync

      - name: Commit federation state
        if: steps.check-secrets.outputs.has-federation-pat == 'true'
        run: |
          git config user.name "federation-bot"
          git config user.email "bot@federation"
          git add data/federation/ || true
          git diff --cached --quiet || git commit -m "chore: heartbeat state"
          git push || true

      - name: Relay outbox to steward-federation hub
        if: steps.check-secrets.outputs.has-federation-pat == 'true'
        env:
          GH_TOKEN: ${{ secrets.FEDERATION_PAT }}
        run: |
          OUTBOX="data/federation/nadi_outbox.json"
          if [ ! -f "$OUTBOX" ] || [ "$(cat "$OUTBOX" | tr -d '[:space:]')" = "[]" ]; then
            echo "Outbox empty, skipping relay"
            exit 0
          fi
          REPO_NAME="${{ github.event.repository.name }}"
          git clone --depth=1 https://x-access-token:${GH_TOKEN}@github.com/kimeisele/steward-federation.git /tmp/hub
          mkdir -p /tmp/hub/nadi
          cp "$OUTBOX" "/tmp/hub/nadi/${REPO_NAME}_to_steward.json"
          cd /tmp/hub
          git config user.name "federation-bot"
          git config user.email "bot@federation"
          git add "nadi/${REPO_NAME}_to_steward.json"
          git diff --cached --quiet || git commit -m "relay: ${REPO_NAME} outbox -> steward (#${{ github.run_number }})"
          max_retries=10
          count=0
          until git push origin main; do
            count=$((count+1))
            if [ $count -gt $max_retries ]; then echo "Push failed"; exit 1; fi
            backoff=$(( (RANDOM % 15) + 2 ))
            sleep $backoff
            git pull --rebase origin main
          done
          echo "[]" > "$OUTBOX"
          echo "Outbox relayed and cleared"
