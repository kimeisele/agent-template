name: Node Heartbeat

on:
  schedule:
    - cron: '2-59/15 * * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run NADI sync cycle
        env:
          GH_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python nadi_kit.py sync
          python nadi_kit.py heartbeat
          python nadi_kit.py sync
          echo "Heartbeat + sync complete"

      - name: Write heartbeat payload
        run: |
            pip install -q 'git+https://github.com/kimeisele/steward-federation.git' 2>/dev/null || true
            mkdir -p data/federation
            nadi --peer-json data/federation/peer.json heartbeat --health 1.0

      - name: Commit federation state
        run: |
          git config user.name "federation-bot"
          git config user.email "bot@federation"
          git add data/federation/ || true
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore: federation heartbeat state"
            git push || echo "Push failed (non-fatal)"
          fi

      - name: Save node keys cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/federation/.node_keys.json
          key: node-keys-${{ github.repository }}-v1

      - name: Relay outbox to steward-federation hub
        if: always()
        env:
          GH_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/federation
          OUTBOX="data/federation/nadi_outbox.json"

          if [ ! -f "$OUTBOX" ]; then
            echo "[]" > "$OUTBOX"
          fi

          if [ "$(cat "$OUTBOX" | tr -d '[:space:]')" = "[]" ]; then
            echo "Outbox empty, skipping relay"
            exit 0
          fi

          git clone --depth=1 https://x-access-token:${GH_TOKEN}@github.com/kimeisele/steward-federation.git /tmp/hub

          mkdir -p /tmp/hub/nadi

          cp "$OUTBOX" /tmp/hub/nadi/agent-template_to_steward.json

          cd /tmp/hub
          git config user.name "federation-bot"
          git config user.email "bot@federation"
          git add nadi/agent-template_to_steward.json
          git diff --cached --quiet || git commit -m "relay: agent-template outbox → steward (heartbeat #${{ github.run_number }})"
          max_retries=10
          count=0
          until git push origin main; do
            count=$((count+1))
            if [ $count -gt $max_retries ]; then
              echo "Push failed after $max_retries attempts"
              exit 1
            fi
            backoff=$(( (RANDOM % 15) + 2 ))
            echo "Race condition. Backoff ${backoff}s then rebase..."
            sleep $backoff
            git pull --rebase origin main
          done

          echo "[]" > "$OUTBOX"
          echo "Outbox relayed and cleared"
