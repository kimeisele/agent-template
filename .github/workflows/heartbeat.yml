name: Node Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Core validation
        run: |
          python -m pytest tests/ -q --tb=short
          ruff check .

      - name: Check optional federation configuration
        id: federation-config
        env:
          FEDERATION_PAT: ${{ secrets.FEDERATION_PAT }}
          NODE_PRIVATE_KEY: ${{ secrets.NODE_PRIVATE_KEY }}
        run: |
          if [ -z "$FEDERATION_PAT" ]; then
            echo "remote-enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing-pat" >> "$GITHUB_OUTPUT"
            echo "::notice ::Remote federation relay skipped: FEDERATION_PAT is not configured. Core validation remains available."
            exit 0
          fi

          if [ -z "$NODE_PRIVATE_KEY" ]; then
            echo "remote-enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing-node-key" >> "$GITHUB_OUTPUT"
            echo "::notice ::Signed remote heartbeat skipped: NODE_PRIVATE_KEY is not configured. Core validation remains available."
            exit 0
          fi

          echo "remote-enabled=true" >> "$GITHUB_OUTPUT"
          echo "reason=configured" >> "$GITHUB_OUTPUT"

      - name: Install nadi-kit
        if: steps.federation-config.outputs.remote-enabled == 'true'
        run: |
          pip install "nadi-kit @ git+https://github.com/kimeisele/steward-federation.git@c613577b7353d3cb1fd31be542aed8766f195079"

      - name: Run NADI heartbeat cycle
        if: steps.federation-config.outputs.remote-enabled == 'true'
        env:
          NODE_PRIVATE_KEY: ${{ secrets.NODE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.FEDERATION_PAT }}
        run: |
          python3 -m nadi_kit --peer-json data/federation/peer.json sync
          python3 -m nadi_kit --peer-json data/federation/peer.json heartbeat --health 1.0
          python3 -m nadi_kit --peer-json data/federation/peer.json sync

      - name: Relay outbox to steward-federation hub
        if: steps.federation-config.outputs.remote-enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.FEDERATION_PAT }}
        run: |
          OUTBOX="data/federation/nadi_outbox.json"
          if [ ! -f "$OUTBOX" ] || [ "$(cat "$OUTBOX" | tr -d '[:space:]')" = "[]" ]; then
            echo "Outbox empty, skipping relay"
            exit 0
          fi
          REPO_NAME="${{ github.event.repository.name }}"
          git clone --depth=1 https://x-access-token:${GH_TOKEN}@github.com/kimeisele/steward-federation.git /tmp/hub
          mkdir -p /tmp/hub/nadi
          cp "$OUTBOX" "/tmp/hub/nadi/${REPO_NAME}_to_steward.json"
          cd /tmp/hub
          git config user.name "federation-bot"
          git config user.email "bot@federation"
          git add "nadi/${REPO_NAME}_to_steward.json"
          git diff --cached --quiet || git commit -m "relay: ${REPO_NAME} outbox -> steward (#${{ github.run_number }})"
          max_retries=10
          count=0
          until git push origin main; do
            count=$((count+1))
            if [ $count -gt $max_retries ]; then echo "Push failed"; exit 1; fi
            backoff=$(( (RANDOM % 15) + 2 ))
            sleep $backoff
            git pull --rebase origin main
          done
          echo "::notice ::Hub relay confirmed; runner working-copy outbox will be cleared for next cycle."
